<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول | أكاديمية تزكى</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Tajawal",sans-serif;
      min-height:100vh;display:grid;place-items:center;
      background:linear-gradient(135deg,#102b46,#075c68);
      padding:20px;
    }
    .card{
      width:min(400px,100%);background:#fff;border-radius:20px;
      padding:32px 28px;box-shadow:0 30px 80px rgba(0,0,0,.3);
    }
    h1{color:#102b46;font-size:24px;margin-bottom:6px;text-align:center}
    .sub{color:#6d8195;font-size:14px;text-align:center;margin-bottom:24px}
    label{display:block;font-weight:700;color:#29465f;margin-bottom:6px;font-size:14px}
    input{
      width:100%;padding:12px 14px;border:1px solid #dce6ef;border-radius:10px;
      font-family:inherit;font-size:15px;margin-bottom:16px;
    }
    input:focus{outline:none;border-color:#078f91;box-shadow:0 0 0 3px #078f911c}
    button{
      width:100%;padding:13px;border:0;border-radius:10px;
      background:linear-gradient(135deg,#0b9b9a,#08777f);color:#fff;
      font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;
      transition:transform .15s;
    }
    button:hover:not(:disabled){transform:translateY(-1px)}
    button:disabled{opacity:.6;cursor:not-allowed}
    .msg{
      margin-top:14px;padding:10px 12px;border-radius:9px;font-size:14px;
      display:none;line-height:1.6;
    }
    .msg.show{display:block}
    .msg.error{background:#fff0f1;color:#a52b39}
    .msg.info{background:#eaf7f7;color:#066b70}
  </style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>لوحة تحكم أكاديمية تزكى</h1>
    <p class="sub">سجّل دخولك للمتابعة</p>
    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" required autocomplete="email">
    <label for="password">كلمة المرور</label>
    <input id="password" type="password" required autocomplete="current-password">
    <button type="submit" id="submitBtn">تسجيل الدخول</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://oojinjlzzqfqbcblgrsm.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_WKICV8R27c87HKTwU9qmkQ_6tiZmjin";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // إذا كان مسجل الدخول بالفعل، انتقل مباشرة
    db.auth.getSession().then(({data:{session}})=>{
      if(session) window.location.replace("./dashboard.html");
    });

    const form = document.getElementById("loginForm");
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");

    function showMsg(text, type){
      msg.textContent = text;
      msg.className = "msg show " + type;
    }

    form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      btn.disabled = true; btn.textContent = "جارٍ الدخول...";
      msg.className = "msg";
      const {error} = await db.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      });
      btn.disabled = false; btn.textContent = "تسجيل الدخول";
      if(error){ showMsg("تعذر الدخول: " + error.message, "error"); return; }
      window.location.replace("./dashboard.html");
    });
  </script>
</body>
</html>
